name: Sync and Build Gamescope

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      latest_tag: ${{ steps.check.outputs.latest_tag }}
    
    steps:
    - name: Check for new upstream tags
      id: check
      run: |
        LATEST_TAG=$(curl -s https://api.github.com/repos/bazzite-org/gamescope/tags | jq -r '.[0].name')
        echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
        
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api.github.com/repos/${{ github.repository }}/releases/tags/build-$LATEST_TAG)
        
        if [[ "$HTTP_CODE" == "404" ]]; then
          echo "should_build=true" >> $GITHUB_OUTPUT
          echo "✅ New tag detected: $LATEST_TAG"
        else
          echo "should_build=false" >> $GITHUB_OUTPUT
          echo "⏭️  Tag $LATEST_TAG already built"
        fi

  sync-main-branch:
    needs: check-and-build
    if: needs.check-and-build.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout default branch
      uses: actions/checkout@v4
      with:
        ref: gamescope-ba
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Configure git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
    - name: Sync default branch with upstream
      run: |
        git remote add upstream https://github.com/bazzite-org/gamescope.git || true
        git fetch upstream --tags
        
        LATEST_TAG="${{ needs.check-and-build.outputs.latest_tag }}"
        
        git merge $LATEST_TAG --no-edit
        git push origin gamescope-ba

  sync-and-build:
    needs: [check-and-build, sync-main-branch]
    runs-on: ubuntu-latest
    container: 
      image: fedora:43
      
    steps:
    - name: Checkout autobuild branch
      uses: actions/checkout@v4
      with:
        ref: feat-touchpad-support-autobuild
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Configure git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        
    - name: Sync autobuild branch with upstream
      id: sync
      run: |
        git remote add upstream https://github.com/bazzite-org/gamescope.git || true
        git fetch upstream --tags
        
        LATEST_TAG="${{ needs.check-and-build.outputs.latest_tag }}"
        
        if git merge $LATEST_TAG --no-edit; then
          echo "status=success" >> $GITHUB_OUTPUT
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          git push origin feat-touchpad-support-autobuild
        else
          echo "status=conflict" >> $GITHUB_OUTPUT
          echo "❌ Merge conflict detected!"
          exit 1
        fi
        
    - name: Install dependencies
      if: steps.sync.outputs.status == 'success'
      run: |
        dnf install -y git rpm-build rpmdevtools curl cpio jq
        
    - name: Setup RPM build directory
      if: steps.sync.outputs.status == 'success'
      run: |
        mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
        
    - name: Download bazzite spec files
      if: steps.sync.outputs.status == 'success'
      run: |
        cd ~/rpmbuild/SPECS
        curl -fsSL https://raw.githubusercontent.com/ublue-os/bazzite/main/spec_files/gamescope/gamescope.spec -o gamescope.spec
        
        grep -E "^(Source|Patch)[0-9]*:" gamescope.spec | while read -r line; do
            filename=$(echo "$line" | awk '{print $2}')
            curl -fsSL https://raw.githubusercontent.com/ublue-os/bazzite/main/spec_files/gamescope/$filename \
              -o ~/rpmbuild/SOURCES/$filename 2>/dev/null || true
        done
        
    - name: Modify spec for this repository
      if: steps.sync.outputs.status == 'success'
      run: |
        cd ~/rpmbuild/SPECS
        sed -i \
          -e "s|URL:.*|URL: https://github.com/${{ github.repository }}|" \
          -e "s|%global version.*|%global version feat-touchpad-support-autobuild|" \
          -e "s|--branch %{version}|--branch feat-touchpad-support-autobuild|" \
          gamescope.spec
          
    - name: Install build dependencies
      if: steps.sync.outputs.status == 'success'
      run: |
        cd ~/rpmbuild/SPECS
        dnf builddep -y gamescope.spec
        
    - name: Build RPM
      if: steps.sync.outputs.status == 'success'
      run: |
        rpmbuild -bb ~/rpmbuild/SPECS/gamescope.spec
        
    - name: Extract gamescope binary from RPM
      if: steps.sync.outputs.status == 'success'
      run: |
        cd ~/rpmbuild/RPMS/x86_64
        rpm2cpio gamescope-*.x86_64.rpm | cpio -idmv './usr/bin/gamescope'
        mv usr/bin/gamescope $GITHUB_WORKSPACE/gamescope
        chmod +x $GITHUB_WORKSPACE/gamescope
        ls -lh $GITHUB_WORKSPACE/gamescope
        
    - name: Get commit info
      if: steps.sync.outputs.status == 'success'
      id: commit
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT
        
    - name: Create release
      if: steps.sync.outputs.status == 'success'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ steps.sync.outputs.tag }}
        name: Build for ${{ steps.sync.outputs.tag }}
        body: |
          ## Gamescope with Touchpad Support
          
          Based on upstream tag: **${{ steps.sync.outputs.tag }}**
          ## License

          This build is based on [bazzite-org/gamescope](https://github.com/bazzite-org/gamescope) which is licensed under BSD 2-Clause License.

          See the [original LICENSE](https://github.com/bazzite-org/gamescope/blob/gamescope-ba/LICENSE) for details.
          
          This build adds libinput touchpad configuration support.
          
          ### Installation
          
          1. Download the `gamescope` binary to a local directory (e.g., `~/bin/`)
          2. Make it executable: `chmod +x ~/bin/gamescope`
          3. Configure environment in `~/.config/environment.d/gamescope-custom.conf`:
             `GAMESCOPE_BIN="$HOME/bin/gamescope --tap-to-click --natural-scrolling touchpad --tap-and-drag --drag-lock"`
          4. Restart your session
          
          **Reference:** See [gamescope-session-plus](https://github.com/bazzite-org/gamescope-session/blob/main/usr/share/gamescope-session-plus/gamescope-session-plus) for how `GAMESCOPE_BIN` is used.
        files: gamescope
        draft: false
        prerelease: false
